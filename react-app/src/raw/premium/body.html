    <!-- INTERSTITIAL AD ENGINE (REFERENCE SPECIFICATION) -->
    <script>
        const INTERSTITIAL_AD_UNIT = (window.__DOMAIN_CONFIG__ && window.__DOMAIN_CONFIG__.ads && window.__DOMAIN_CONFIG__.ads.interstitial_slot) || "/21775744923/example/interstitial";
        const INTERSTITIAL_COOLDOWN = 90 * 1000;
        const INTERSTITIAL_COOLDOWN_KEY = "last_interstitial_time";

        let interstitialSlot = null;
        let interstitialReady = false;
        let interstitialShowing = false;
        let pendingHref = null;
        let fallbackTimer = null;

        function logInterstitial(message, data = "") {
            console.log("[INTERSTITIAL]", message, data);
        }

        function canShowInterstitial() {
            const lastShown = parseInt(localStorage.getItem(INTERSTITIAL_COOLDOWN_KEY) || "0");
            const elapsed = Date.now() - lastShown;
            if (elapsed < INTERSTITIAL_COOLDOWN) {
                return false;
            }
            return true;
        }

        function navigateTo(href) {
            interstitialShowing = false;
            interstitialReady = false;
            pendingHref = null;
            if (fallbackTimer) {
                clearTimeout(fallbackTimer);
                fallbackTimer = null;
            }
            window.location.href = href;
        }

        function scheduleAdRefresh() {
            setTimeout(function () {
                if (!interstitialSlot) return;
                googletag.cmd.push(function () {
                    googletag.pubads().refresh([interstitialSlot]);
                });
            }, INTERSTITIAL_COOLDOWN);
        }

        googletag.cmd.push(function () {
            interstitialSlot = googletag.defineOutOfPageSlot(
                INTERSTITIAL_AD_UNIT,
                googletag.enums.OutOfPageFormat.INTERSTITIAL
            );

            if (!interstitialSlot) return;

            interstitialSlot.setConfig({
                interstitial: {
                    triggers: {
                        continueReading: false,
                    },
                },
            });

            interstitialSlot.addService(googletag.pubads());

            googletag.pubads().addEventListener("slotRenderEnded", function (event) {
                if (event.slot !== interstitialSlot) return;
                if (event.isEmpty) {
                    interstitialReady = false;
                    if (pendingHref) navigateTo(pendingHref);
                    return;
                }
                interstitialReady = true;
                localStorage.setItem(INTERSTITIAL_COOLDOWN_KEY, Date.now());
                scheduleAdRefresh();
            });

            googletag.pubads().addEventListener("slotVisibilityChanged", function (event) {
                if (event.slot !== interstitialSlot) return;
                if (event.inViewPercentage === 0) {
                    if (pendingHref) navigateTo(pendingHref);
                }
            });

            googletag.enableServices();
            googletag.display(interstitialSlot);
        });

        document.addEventListener("visibilitychange", function () {
            if (document.hidden && interstitialShowing && pendingHref) {
                navigateTo(pendingHref);
            }
        });

        document.addEventListener("click", function (e) {
            if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
            const target = e.target.closest("a");
            if (!target) return;
            if (target.closest && (target.closest("#div-overlay-img") || target.closest(".ad-overlay") || target.closest(".ad-slot") || target.closest("#floatingAdContainer") || target.closest("#bottom-ad-container") || target.closest("#outstream-ad-container"))) return;

            const rawHref = target.getAttribute("href");
            if (!rawHref || rawHref.startsWith("#") || rawHref.startsWith("javascript:") || rawHref.startsWith("mailto:") || rawHref.startsWith("tel:")) return;
            if (target.target === "_blank") return;

            let url;
            try { url = new URL(target.href); } catch (err) { return; }
            if (url.hostname !== location.hostname && url.hostname !== "zevixa.site") return;

            if (interstitialShowing || !canShowInterstitial() || document.hidden || !interstitialReady) return;

            e.preventDefault();
            interstitialShowing = true;
            pendingHref = target.href;

            try {
                googletag.display(interstitialSlot);
            } catch (err) {
                navigateTo(target.href);
                return;
            }

            fallbackTimer = setTimeout(function () {
                if (pendingHref) navigateTo(pendingHref);
            }, 12000);
        }, true);
    </script>

    <!-- STICKY BOTTOM AD JS CODE (REFERENCE SPECIFICATION) -->
    <script>
        window.googletag = window.googletag || { cmd: [] };
        googletag.cmd.push(function () {
            var mapping = googletag.sizeMapping()
                .addSize([1024, 0], [[970, 250], [970, 90], [728, 90], [336, 280], [300, 250]])
                .addSize([768, 0], [[728, 90], [468, 60], [300, 250]])
                .addSize([0, 0], [[320, 50], [300, 250], [336, 280]])
                .build();

            var cfgAds = (window.__DOMAIN_CONFIG__ && window.__DOMAIN_CONFIG__.ads) || {};
            var bUnit = cfgAds.bottom_slot || "/21775744923/example/banner";

            googletag.defineSlot(
                bUnit,
                [[970, 250], [970, 90], [728, 90], [468, 60], [336, 280], [300, 250], [320, 50]],
                "div-gpt-ad-bottom"
            )
                .defineSizeMapping(mapping)
                .addService(googletag.pubads());
            googletag.enableServices();
        });

        (function () {
            var REFRESH_INTERVAL_MS = 40000;
            var TOGGLE_REVEAL_DELAY_MS = 12000;
            var AUTO_COLLAPSE_DELAY_MS = 6000;

            var container = document.getElementById("bottom-ad-container");
            var button = document.getElementById("toggle-ad");

            var isCollapsed = false;
            var refreshTimer = null;
            var autoCollapseTimer = null;

            setTimeout(function () {
                if (button) button.style.display = "block";
            }, TOGGLE_REVEAL_DELAY_MS);

            function collapse() {
                if (container) container.classList.add("collapsed");
                isCollapsed = true;
            }

            function expand() {
                if (container) container.classList.remove("collapsed");
                isCollapsed = false;
            }

            function scheduleAutoCollapse() {
                if (autoCollapseTimer) clearTimeout(autoCollapseTimer);
                expand();
                autoCollapseTimer = setTimeout(collapse, AUTO_COLLAPSE_DELAY_MS);
            }

            if (button) {
                button.onclick = function () {
                    if (autoCollapseTimer) {
                        clearTimeout(autoCollapseTimer);
                        autoCollapseTimer = null;
                    }
                    if (!isCollapsed) {
                        collapse();
                    } else {
                        expand();
                    }
                };
            }

            function startRefresh() {
                refreshTimer = setInterval(function () {
                    if (document.hidden) return;
                    if (typeof googletag !== "undefined") {
                        googletag.cmd.push(function () {
                            var slots = googletag.pubads().getSlots();
                            var slot = null;
                            for (var i = 0; i < slots.length; i++) {
                                if (slots[i].getSlotElementId() === "div-gpt-ad-bottom") {
                                    slot = slots[i];
                                    break;
                                }
                            }
                            if (slot) {
                                googletag.pubads().refresh([slot]);
                            }
                        });
                    }
                }, REFRESH_INTERVAL_MS);
            }

            googletag.cmd.push(function () {
                googletag.pubads().addEventListener("slotRenderEnded", function (event) {
                    if (event.slot.getSlotElementId() === "div-gpt-ad-bottom") {
                        scheduleAutoCollapse();
                    }
                });
            });

            if (container) {
                var observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (mutation) {
                        if (mutation.attributeName === "style" && container.style.display !== "none") {
                            observer.disconnect();
                            startRefresh();
                        }
                    });
                });
                observer.observe(container, { attributes: true });
            }
        })();
    </script>

    <!-- OUTSTREAM VIDEO AD & FALLBACK BOTTOM AD TRIGGER (REFERENCE SPECIFICATION) -->
    <script>
        (function () {
            var CLOSE_DELAY_SECONDS = 5;
            var SAFETY_TIMEOUT_MS = 15000;

            var container = document.getElementById("outstream-ad-container");
            var closeBtn = document.getElementById("ad-close");
            var adSlot = document.getElementById("ad-slot");

            var adsManager = null;
            var canClose = false;
            var countdownTimer = null;
            var bottomAdLoaded = false;
            var safetyTimer = null;
            var cleanupCalled = false;

            function loadBottomAd() {
                if (bottomAdLoaded) return;
                bottomAdLoaded = true;

                var bottomContainer = document.getElementById("bottom-ad-container");
                if (bottomContainer) {
                    bottomContainer.style.display = "block";
                }

                if (typeof googletag !== "undefined") {
                    googletag.cmd.push(function () {
                        var slots = googletag.pubads().getSlots();
                        var slot = null;
                        for (var i = 0; i < slots.length; i++) {
                            if (slots[i].getSlotElementId() === "div-gpt-ad-bottom") {
                                slot = slots[i];
                                break;
                            }
                        }

                        if (slot) {
                            if (!slot.getResponseInformation()) {
                                googletag.display("div-gpt-ad-bottom");
                                googletag.pubads().refresh([slot]);
                            } else {
                                googletag.pubads().refresh([slot]);
                            }
                        }
                    });
                }
            }
            window.loadBottomAd = loadBottomAd;

            function cleanupAd() {
                if (cleanupCalled) return;
                cleanupCalled = true;

                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                if (safetyTimer) {
                    clearTimeout(safetyTimer);
                    safetyTimer = null;
                }
                if (container) container.style.display = "none";
                if (adsManager) {
                    try { adsManager.destroy(); } catch (e) { }
                    adsManager = null;
                }

                loadBottomAd();
            }

            if (typeof google === 'undefined' || !google.ima) {
                loadBottomAd();
                return;
            }

            var video = document.createElement("video");
            video.style.width = "100%";
            video.style.height = "100%";
            video.muted = true;
            video.playsInline = true;
            adSlot.appendChild(video);

            var adDisplayContainer = new google.ima.AdDisplayContainer(adSlot, video);
            var adsLoader = new google.ima.AdsLoader(adDisplayContainer);
            var CORRELATOR = Date.now() + Math.floor(Math.random() * 100000);

            var cfgAds = (window.__DOMAIN_CONFIG__ && window.__DOMAIN_CONFIG__.ads) || {};
            var VAST_URL = cfgAds.outstream_vast_url || (
                "https://pubads.g.doubleclick.net/gampad/ads?" +
                "iu=/21775744923/external/single_ad_samples&cust_params=sample_ct%3Dlinear" +
                "&description_url=" + encodeURIComponent(location.href) +
                "&url=" + encodeURIComponent(location.href) +
                "&sz=300x250" +
                "&gdfp_req=1" +
                "&unviewed_position_start=1" +
                "&env=vp" +
                "&output=vast" +
                "&plcmt=2" +
                "&vpmute=1" +
                "&tfcd=0" +
                "&npa=0" +
                "&correlator=" + CORRELATOR
            );

            function requestAd() {
                try {
                    adDisplayContainer.initialize();
                    var adsRequest = new google.ima.AdsRequest();
                    adsRequest.adTagUrl = VAST_URL;
                    adsRequest.linearAdSlotWidth = 300;
                    adsRequest.linearAdSlotHeight = 250;
                    adsLoader.requestAds(adsRequest);
                } catch (e) {
                    cleanupAd();
                }
            }

            if (document.hidden) {
                document.addEventListener("visibilitychange", function onVisible() {
                    if (!document.hidden) {
                        document.removeEventListener("visibilitychange", onVisible);
                        requestAd();
                    }
                });
            } else {
                requestAd();
            }

            adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED, function (event) {
                try {
                    adsManager = event.getAdsManager(video);
                    container.style.display = "block";
                    adsManager.init(300, 250, google.ima.ViewMode.NORMAL);
                    adsManager.start();

                    canClose = false;
                    var count = CLOSE_DELAY_SECONDS;
                    closeBtn.textContent = count;
                    closeBtn.className = "counting";

                    countdownTimer = setInterval(function () {
                        count--;
                        if (count > 0) {
                            closeBtn.textContent = count;
                        } else {
                            clearInterval(countdownTimer);
                            countdownTimer = null;
                            closeBtn.textContent = "\u2716";
                            closeBtn.className = "ready";
                            canClose = true;
                            setTimeout(function () {
                                if (closeBtn.className === "ready") {
                                    closeBtn.style.opacity = "0";
                                }
                            }, 4000);
                        }
                    }, 1000);

                    safetyTimer = setTimeout(function () {
                        cleanupAd();
                    }, SAFETY_TIMEOUT_MS);

                    adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE, cleanupAd);
                    adsManager.addEventListener(google.ima.AdEvent.Type.SKIPPED, cleanupAd);
                    adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, cleanupAd);
                    adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, cleanupAd);
                } catch (e) {
                    cleanupAd();
                }
            });

            adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, function () {
                cleanupAd();
            });

            closeBtn.addEventListener("click", function () {
                if (!canClose) return;
                cleanupAd();
            });

            container.addEventListener("click", function (e) {
                if (e.target === closeBtn) return;
                if (!canClose) return;
                closeBtn.style.opacity = "1";
            });
        })();
    </script>
